[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fm26-scout"
version = "2.0.0"
description = "Football Manager 26 save -> leak-free table of visible and hidden player data -> TabPFN-3.5 predictions of what the game hides"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fmsave[pandas]>=0.5.3,<0.6",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyarrow>=15",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12",
  "tabpfn-client>=0.6.1,<0.7",
  "tabpfn-extensions[interpretability]>=0.6.3,<0.7",  # Prior Labs SHAP for the why lines
  "openai>=1.55,<3",
]

[project.optional-dependencies]
# TabPFN-3.5 on this computer (CUDA, Apple MPS or CPU); the weights need a one-time Prior Labs
# licence acceptance
local = ["tabpfn>=9,<10"]
bench = ["catboost>=1.2,<2"]  # the CatBoost baseline in `fm26 benchmark`
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "shapiq>=1.6"]  # shapiq: scripts/bench_shap.py

[project.scripts]
fm26 = "fm26scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fm26scout = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "I", "UP", "B"]
